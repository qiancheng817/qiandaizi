name: Build and Push Image

# 在 GitHub 上自动把 钱袋子（qiandaizi）构建成多架构镜像，并推送到：
#   1) GHCR        —— ghcr.io/qiancheng817/qiandaizi（GITHUB_TOKEN 免密，开箱即用）
#   2) Docker Hub  —— 可选：在仓库 Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后自动启用
# 推完后在 NAS 上只要 `docker compose up -d` 拉镜像即可，无需本地编译。
#
# 可选仓库 Secrets（不配则只发 GHCR）：
#   DOCKERHUB_USERNAME —— Docker Hub 用户名
#   DOCKERHUB_TOKEN    —— Docker Hub 访问令牌（hub.docker.com -> Account Settings -> Security -> New Access Token，勾选 Read/Write）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: qiandaizi

jobs:
  # ---------------------------------------------------------------
  # 全新部署冒烟：用【空数据卷】跑真容器，1:1 复现 NAS 上首次
  # `docker compose up -d` 的场景。任何「空库启动即崩」的问题
  # 都会在这里被拦住，不让坏镜像推到镜像仓库。
  # ---------------------------------------------------------------
  smoke:
    name: 全新部署冒烟（空数据卷）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 amd64 测试镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: qiandaizi:fresh-smoke
          build-args: |
            APP_VERSION=smoke
          cache-from: type=gha

      - name: 空数据卷启动 → 健康检查 → 写入 → 重启，全程断言
        run: |
          set -euo pipefail
          docker rm -f qiandaizi-smoke 2>/dev/null || true
          docker volume rm qiandaizi-smoke-data 2>/dev/null || true
          docker volume create qiandaizi-smoke-data >/dev/null

          # 全新空卷 = 首次部署
          docker run -d --name qiandaizi-smoke -p 9611:9600 \
            -e JWT_SECRET=smoke-secret \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin123 \
            -v qiandaizi-smoke-data:/app/data \
            qiandaizi:fresh-smoke

          wait_health() {
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:9611/api/health >/dev/null 2>&1; then return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' qiandaizi-smoke 2>/dev/null)" != "true" ]; then
                echo "❌ 容器已退出（无限重启）"; docker logs qiandaizi-smoke; return 1
              fi
              sleep 2
            done
            echo "❌ 健康检查超时"; docker logs qiandaizi-smoke; return 1
          }

          echo "=== 首次启动 ==="
          wait_health
          docker logs qiandaizi-smoke

          # 版本号必须来自镜像内 /app/VERSION
          curl -sf http://127.0.0.1:9611/api/meta; echo

          echo "=== 登录 + 记一笔流水（真实写入路径）==="
          TOKEN=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            http://127.0.0.1:9611/api/auth/login \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"bookId":1,"type":"expense","amount":9.9,"category":"餐饮","description":"ci-smoke","payment_method":"现金","flow_time":"2026-09-10 12:00:00"}' \
            "http://127.0.0.1:9611/api/flows?bookId=1"
          echo
          curl -sf -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:9611/api/flows?bookId=1&pageSize=5" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["list"], "写入的流水读不回来";print("流水读回 OK, total =", d["total"])'
          curl -sf -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:9611/api/utility/rules?bookId=1" >/dev/null
          curl -sf -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:9611/api/stats/overview?bookId=1&month=2026-09" >/dev/null
          echo "核心接口 OK"

          echo "=== 重启容器（模拟 NAS 上 docker compose up -d 重跑）==="
          docker restart qiandaizi-smoke
          wait_health
          curl -sf -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:9611/api/flows?bookId=1&pageSize=5" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["total"]==1, "重启后数据不一致: %s" % d["total"];print("重启后数据仍在 OK")'

          echo "=== 启动日志异常断言 ==="
          LOGS=$(docker logs qiandaizi-smoke 2>&1)
          echo "$LOGS"
          if echo "$LOGS" | grep -E "SqliteError|no such column|no such table|校准失败|启动生成失败|启动重建失败|UnhandledPromiseRejection|Error:"; then
            echo "❌ 启动日志出现异常/降级警告"; exit 1
          fi
          echo "✅ 全新部署冒烟全部通过"

      - name: 清理
        if: ${{ always() }}
        run: |
          docker logs qiandaizi-smoke > /tmp/smoke-final.log 2>&1 || true
          docker rm -f qiandaizi-smoke 2>/dev/null || true
          docker volume rm qiandaizi-smoke-data 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    needs: smoke          # 全新部署冒烟不过 → 不推镜像
    env:
      # 映射到 env 供步骤 if/脚本判断（secrets 不能直接用在 if 表达式里）
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (交叉编译 arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 为可选发布渠道：仓库 Secrets 未配置时自动跳过，只发 GHCR
      - name: Log in to Docker Hub
        if: ${{ env.DH_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算版本号（发布时间，北京时间 vYYMMDD-HHMM）
        id: ver
        run: echo "APP_VERSION=v$(TZ=Asia/Shanghai date +%y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: 计算镜像 tags（Docker Hub 未配置时只发 GHCR）
        id: tags
        env:
          VER: ${{ steps.ver.outputs.APP_VERSION }}
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAGS="ghcr.io/${REPO_LC}:latest,ghcr.io/${REPO_LC}:${VER}"
          if [ -n "$DH_USER" ]; then
            TAGS="${DH_USER}/${IMAGE_NAME}:latest,${DH_USER}/${IMAGE_NAME}:${VER},${TAGS}"
          fi
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "最终 tags: ${TAGS}"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 将 GHCR 镜像包设为 Public（便于备用免登录拉取）
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${GITHUB_REPOSITORY##*/}"
          curl -s -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG}/visibility" \
            -d '{"visibility":"public"}' \
            || echo "若失败，请到 GitHub -> Packages -> ${PKG} -> Settings 把可见性改为 Public"

      - name: 创建 / 更新 GitHub Release（与镜像同步）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.APP_VERSION }}"
          REPO="${{ github.repository }}"
          REPO_LC="${{ steps.tags.outputs.repo_lc }}"
          PREV=$(git tag --sort=-creatordate | head -1)
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          LOG=$(git log --no-merges --pretty=format:"- %s" -n 25 "$RANGE")
          BODY="## 镜像（构建于 ${TAG}）"$'\n\n'"- GHCR：docker pull ghcr.io/${REPO_LC}:latest 或 ghcr.io/${REPO_LC}:${TAG}"
          if [ -n "$DH_USER" ]; then
            BODY="${BODY}"$'\n'"- Docker Hub：docker pull ${DH_USER}/${IMAGE_NAME}:latest 或 ${DH_USER}/${IMAGE_NAME}:${TAG}"
          fi
          BODY="${BODY}"$'\n\n'"## 本次更新"$'\n'"${LOG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明"
            gh release edit "$TAG" --notes "$BODY"
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" --title "$TAG" --latest --notes "$BODY"
          fi
